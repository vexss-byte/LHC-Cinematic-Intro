plugins {
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = 'com.laper'
base { archivesName = 'laper-hardcore-intro' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Capture the version as a plain String so task actions do not access the
// Gradle Project model while configuration-cache state is being stored.
def modVersion = project.version.toString()

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand(version: modVersion)
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
